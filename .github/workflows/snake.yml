name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jason21333
          outputs: |
            dist/github-snake.svg?color_snake=#ff9100&color_dots=#1a1c23,#5e35b1,#7e57c2,#9575cd,#b39ddb
            dist/github-snake-dark.svg?color_snake=#ff9100&color_dots=#1a1c23,#5e35b1,#7e57c2,#9575cd,#b39ddb

      - name: push github-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
